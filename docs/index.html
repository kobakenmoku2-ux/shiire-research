<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リサーチ管理画面</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<h1>リサーチ管理画面</h1>

<div id="signin-view">
  <p>Googleアカウントでログインしてください。</p>
  <button id="google-signin-button" class="primary-btn">Googleでログイン</button>
</div>

<div id="main-view" class="hidden">
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="conditions">条件</button>
      <button class="tab-btn" data-tab="recipients">通知先</button>
      <button class="tab-btn" data-tab="settings">設定</button>
      <button class="secondary-btn" id="help-btn" style="margin-left:16px;">使い方</button>
    </div>
    <div>
      <button class="secondary-btn" id="biometric-btn">Face ID/Touch IDを設定</button>
      <button class="secondary-btn" id="signout-btn">ログアウト</button>
    </div>
  </div>

  <div id="conditions-tab">
    <div class="toolbar">
      <span></span>
      <button class="primary-btn" id="new-condition-btn">＋ 新規登録</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>リサーチ名</th><th>キーワード</th><th>価格帯</th><th>目標利益率</th><th>状態</th></tr>
      </thead>
      <tbody id="conditions-tbody"></tbody>
    </table>
    </div>
  </div>

  <div id="recipients-tab" class="hidden">
    <div class="toolbar">
      <span></span>
      <button class="primary-btn" id="new-recipient-btn">＋ 新規登録</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>名前</th><th>メール</th><th>LINE</th></tr>
      </thead>
      <tbody id="recipients-tbody"></tbody>
    </table>
    </div>
  </div>

  <div id="settings-tab" class="hidden">
    <div class="card" style="max-width:420px;margin:0;">
      <div class="field"><label>販売手数料率(%)</label><input type="number" id="s-fee-rate"></div>
      <div class="field"><label>送料別と分かっている場合の送料(円)</label><input type="number" id="s-default-shipping"><div class="hint">ヤフオクなど。条件ごとに個別の送料を設定していない場合に使われます</div></div>
      <div class="field"><label>送料が要確認の場合に見込む送料(円)</label><input type="number" id="s-unknown-shipping"><div class="hint">ラクマ・メルカリ用。基本的に送料込みが多いためデフォルトは0です</div></div>
      <div class="form-actions" style="justify-content:flex-end;">
        <button class="primary-btn" id="settings-save">保存</button>
      </div>
    </div>
  </div>

  <div id="status-message" class="hidden"></div>
</div>

<div id="detail-overlay" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:16px;">
  <div class="card" id="detail-card"></div>
</div>

<div id="help-overlay" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:16px;">
  <div class="card" id="help-card" style="max-width:560px;max-height:80vh;overflow-y:auto;"></div>
</div>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
